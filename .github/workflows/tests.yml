name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: financial_analysis_test
          POSTGRES_USER: financial
          POSTGRES_PASSWORD: financial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial -d financial_analysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://financial:financial@localhost:5432/financial_analysis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: pytest --cov=financial_analysis --cov-report=term-missing
