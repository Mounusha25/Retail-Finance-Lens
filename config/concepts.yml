concepts:
  net_sales:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: SalesRevenueNet, priority: 10}
      - {taxonomy: us-gaap, concept: RevenueFromContractWithCustomerExcludingAssessedTax, priority: 20}
      - {taxonomy: cost, concept: NetSales, priority: 5, company: COST}
      - {taxonomy: tgt, concept: Sales, priority: 5, company: TGT}
  membership_other_revenue:
    period_type: duration
    aliases:
      - {taxonomy: cost, concept: MembershipFees, priority: 5, company: COST}
      - {taxonomy: wmt, concept: MembershipAndOtherIncome, priority: 5, company: WMT}
      - {taxonomy: tgt, concept: OtherRevenue, priority: 5, company: TGT}
  total_revenue:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: Revenues, priority: 10}
      - {taxonomy: us-gaap, concept: RevenueFromContractWithCustomerIncludingAssessedTax, priority: 20}
      - {taxonomy: cost, concept: TotalRevenue, priority: 5, company: COST}
      # Kroger has no separate membership line: reported sales are its total revenue.
      - {taxonomy: us-gaap, concept: RevenueFromContractWithCustomerExcludingAssessedTax, priority: 5, company: KR}
  cost_of_sales:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: CostOfRevenue, priority: 10}
      - {taxonomy: us-gaap, concept: CostOfGoodsAndServicesSold, priority: 20}
      - {taxonomy: cost, concept: MerchandiseCosts, priority: 5, company: COST}
      - {taxonomy: wmt, concept: CostOfSales, priority: 5, company: WMT}
      - {taxonomy: tgt, concept: CostOfSales, priority: 5, company: TGT}
      # Kroger reports merchandise costs excluding depreciation, rent and similar items.
      - {taxonomy: us-gaap, concept: CostOfGoodsAndServiceExcludingDepreciationDepletionAndAmortization, priority: 5, company: KR}
      - {taxonomy: us-gaap, concept: CostOfGoodsSold, priority: 6, company: KR}
  operating_income:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: OperatingIncomeLoss, priority: 10}
  net_income:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: NetIncomeLoss, priority: 10}
      - {taxonomy: us-gaap, concept: ProfitLoss, priority: 20}
  cash_and_cash_equivalents:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: CashAndCashEquivalentsAtCarryingValue, priority: 10}
      - {taxonomy: us-gaap, concept: CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents, priority: 20}
  short_term_investments:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: ShortTermInvestments, priority: 10}
      - {taxonomy: us-gaap, concept: MarketableSecuritiesCurrent, priority: 20}
  accounts_receivable_net_current:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: AccountsReceivableNetCurrent, priority: 10}
      - {taxonomy: us-gaap, concept: AccountsNotesAndLoansReceivableNetCurrent, priority: 20}
      - {taxonomy: us-gaap, concept: ReceivablesNetCurrent, priority: 30}
      - {taxonomy: us-gaap, concept: AccountsAndOtherReceivablesNetCurrent, priority: 5, company: TGT}
  inventory:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: InventoryNet, priority: 10}
      - {taxonomy: us-gaap, concept: InventoryFinishedGoodsNetOfAllowancesCustomerAdvancesAndProgressBillings, priority: 20}
  # Kroger tags inventory on a FIFO basis plus a LIFO reserve rather than one net figure;
  # transform.derive_net_inventory combines them into `inventory`.
  fifo_inventory:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: FIFOInventoryAmount, priority: 10, company: KR}
  lifo_reserve:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: InventoryLIFOReserve, priority: 10, company: KR}
  current_assets:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: AssetsCurrent, priority: 10}
  accounts_payable_current:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: AccountsPayableCurrent, priority: 10}
      - {taxonomy: us-gaap, concept: AccountsPayableTradeCurrent, priority: 20, company: KR}
  short_term_borrowings:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: ShortTermBorrowings, priority: 10}
  current_debt:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: LongTermDebtCurrent, priority: 10}
      - {taxonomy: us-gaap, concept: LongTermDebtAndCapitalLeaseObligationsCurrent, priority: 20}
      - {taxonomy: us-gaap, concept: ShortTermBorrowingsAndCurrentMaturitiesOfLongTermDebt, priority: 30}
  current_liabilities:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: LiabilitiesCurrent, priority: 10}
  long_term_debt_noncurrent:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: LongTermDebtNoncurrent, priority: 10}
      - {taxonomy: us-gaap, concept: LongTermDebtAndFinanceLeaseObligationsNoncurrent, priority: 20}
      - {taxonomy: us-gaap, concept: LongTermDebtAndCapitalLeaseObligations, priority: 30}
  total_assets:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: Assets, priority: 10}
  total_liabilities:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: Liabilities, priority: 10}
  total_liabilities_and_equity:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: LiabilitiesAndStockholdersEquity, priority: 10}
  stockholders_equity:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: StockholdersEquity, priority: 10}
  income_tax_expense:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: IncomeTaxExpenseBenefit, priority: 10}
  total_equity:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest, priority: 10}
      - {taxonomy: us-gaap, concept: StockholdersEquity, priority: 20}
  operating_cash_flow:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: NetCashProvidedByUsedInOperatingActivities, priority: 10}
      - {taxonomy: us-gaap, concept: NetCashProvidedByUsedInOperatingActivitiesContinuingOperations, priority: 20}
  capital_expenditures:
    period_type: duration
    normalize: absolute
    aliases:
      - {taxonomy: us-gaap, concept: PaymentsToAcquirePropertyPlantAndEquipment, priority: 10}
      - {taxonomy: us-gaap, concept: PaymentsForAdditionsToPropertyPlantAndEquipment, priority: 20}
      - {taxonomy: us-gaap, concept: PaymentsToAcquireProductiveAssets, priority: 30, company: KR}
  dividends_paid:
    period_type: duration
    normalize: absolute
    aliases:
      - {taxonomy: us-gaap, concept: PaymentsOfDividendsCommonStock, priority: 10}
      - {taxonomy: us-gaap, concept: PaymentsOfDividends, priority: 20}
      - {taxonomy: us-gaap, concept: DividendsCommonStockCash, priority: 30}
  share_repurchases:
    period_type: duration
    normalize: absolute
    aliases:
      - {taxonomy: us-gaap, concept: PaymentsForRepurchaseOfCommonStock, priority: 10}
  debt_issued:
    period_type: duration
    normalize: absolute
    aliases:
      - {taxonomy: us-gaap, concept: ProceedsFromIssuanceOfLongTermDebt, priority: 10}
  debt_repaid:
    period_type: duration
    normalize: absolute
    aliases:
      - {taxonomy: us-gaap, concept: RepaymentsOfLongTermDebt, priority: 10}
      - {taxonomy: us-gaap, concept: RepaymentsOfLongTermDebtAndCapitalSecurities, priority: 20}
  depreciation_amortization:
    period_type: duration
    normalize: absolute
    aliases:
      - {taxonomy: us-gaap, concept: DepreciationDepletionAndAmortization, priority: 10}
      - {taxonomy: us-gaap, concept: DepreciationAmortizationAndAccretionNet, priority: 20, company: WMT}
  interest_paid:
    period_type: duration
    normalize: absolute
    aliases:
      # Gross cash interest where tagged (Kroger); otherwise interest paid net of capitalized interest.
      - {taxonomy: us-gaap, concept: InterestPaid, priority: 10}
      - {taxonomy: us-gaap, concept: InterestPaidNet, priority: 20}
  operating_lease_liability:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: OperatingLeaseLiability, priority: 10}
  # Weighted-average discount rate of operating leases, a decimal (0.047 = 4.7%).
  operating_lease_discount_rate:
    period_type: instant
    unit: pure
    aliases:
      - {taxonomy: us-gaap, concept: OperatingLeaseWeightedAverageDiscountRatePercent, priority: 10}
  # Single-line restructuring / impairment totals as tagged by the issuer. Only one concept is chosen per period
  # (by priority), so charges are never double counted. Untagged charges are not captured.
  restructuring_impairment_charges:
    period_type: duration
    normalize: absolute
    aliases:
      - {taxonomy: us-gaap, concept: RestructuringCostsAndAssetImpairmentCharges, priority: 10}
      - {taxonomy: us-gaap, concept: AssetImpairmentCharges, priority: 20}
      - {taxonomy: us-gaap, concept: GoodwillImpairmentLoss, priority: 30}
  # Net PP&E. Target and Kroger tag the combined PP&E-and-finance-lease-ROU total in recent years.
  ppe_net:
    period_type: instant
    aliases:
      - {taxonomy: us-gaap, concept: PropertyPlantAndEquipmentNet, priority: 10}
      - {taxonomy: us-gaap, concept: PropertyPlantAndEquipmentAndFinanceLeaseRightOfUseAssetAfterAccumulatedDepreciationAndAmortization, priority: 20}
  investing_cash_flow:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: NetCashProvidedByUsedInInvestingActivities, priority: 10}
  financing_cash_flow:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: NetCashProvidedByUsedInFinancingActivities, priority: 10}
  fx_effect_on_cash:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: EffectOfExchangeRateOnCashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents, priority: 10}
      - {taxonomy: us-gaap, concept: EffectOfExchangeRateOnCashAndCashEquivalents, priority: 20}
  net_change_in_cash:
    period_type: duration
    aliases:
      - {taxonomy: us-gaap, concept: CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalentsPeriodIncreaseDecreaseIncludingExchangeRateEffect, priority: 10}
      - {taxonomy: us-gaap, concept: CashAndCashEquivalentsPeriodIncreaseDecrease, priority: 20}
